# SentinelMonitorIA - Vector 0.36 configuration for Linux hosts
# The entrypoint expands ${SENTINEL_*} values before validation.

data_dir = "/var/lib/sentinelmonitoria"

# -------------------------------
# Sources
# -------------------------------

[sources.system_metrics]
type = "host_metrics"
collectors = ["cpu", "memory", "disk", "filesystem", "network", "load"]
namespace = "system"
scrape_interval_secs = 10

[sources.system_logs]
type = "journald"
include_units = ["*.service", "*.slice", "*.socket"]
exclude_units = ["docker.*"]

[sources.application_logs]
type = "file"
include = ["/var/log/**/*.log", "/var/log/syslog", "/var/log/messages"]
read_from = "end"
max_read_bytes = 10485760
multiline.start_pattern = '^\\d{4}-\\d{2}-\\d{2}'
multiline.mode = "halt_before"
multiline.condition_pattern = '^\\s+'
multiline.timeout_ms = 1000

# Docker container logs are available when the Docker socket is mounted.
[sources.docker_logs]
type = "docker_logs"
include_containers = ["*"]
exclude_containers = []
include_images = ["*"]
include_labels = ["*"]
docker_host = "unix:///var/run/docker.sock"

# -------------------------------
# Parsing and enrichment
# -------------------------------

[transforms.parse_system_logs]
type = "remap"
inputs = ["system_logs", "application_logs"]
source = '''
if !exists(.timestamp) {
  .timestamp = now()
}

message = string!(.message)
if match(message, r'ERROR|FATAL') {
  .level = "error"
} else if match(message, r'WARN|WARNING') {
  .level = "warning"
} else if match(message, r'INFO') {
  .level = "info"
} else if match(message, r'DEBUG') {
  .level = "debug"
} else {
  .level = "info"
}

if exists(.SYSLOG_IDENTIFIER) {
  .service = string!(.SYSLOG_IDENTIFIER)
} else {
  .service = "system"
}

.host = get_hostname!()
'''

[transforms.enrich_system_metrics]
type = "remap"
inputs = ["system_metrics"]
source = '''
.metric_type = "gauge"
.host = get_hostname!()
.collection_timestamp = now()
'''

[transforms.parse_docker_logs]
type = "remap"
inputs = ["docker_logs"]
source = '''
if exists(.container_id) {
  .container_id_short = slice!(string!(.container_id), 0, 12)
}

if exists(.container_name) {
  .service = string!(.container_name)
} else if exists(.image) {
  .service = string!(.image)
} else {
  .service = "docker"
}

message = string!(.message)
if match(message, r'Error|error|ERROR|Fatal|fatal') {
  .level = "error"
} else if match(message, r'Warn|warn|WARNING') {
  .level = "warning"
} else {
  .level = "info"
}

if !exists(.timestamp) {
  .timestamp = now()
}
'''

# -------------------------------
# TelemetryBatch envelopes
# -------------------------------

[transforms.telemetry_metrics]
type = "remap"
inputs = ["enrich_system_metrics"]
source = '''
event_timestamp = format_timestamp!(now(), format: "%+")
metric_name = string!(.name)
metric_value = to_float!(.value)
agent_id = get_env_var!("SENTINEL_AGENT_ID")
host = get_env_var!("SENTINEL_HOSTNAME")
agent_version = get_env_var!("SENTINEL_AGENT_VERSION")

. = {
  "metadata": {
    "agent_id": agent_id,
    "hostname": host,
    "timestamp": event_timestamp,
    "agent_version": agent_version,
    "platform": "linux",
    "architecture": "amd64",
    "tags": {"source": "host_metrics"}
  },
  "metrics": [{
    "name": metric_name,
    "value": metric_value,
    "type": "gauge",
    "timestamp": event_timestamp,
    "labels": {"hostname": host, "source": "host_metrics"},
    "unit": ""
  }],
  "logs": [],
  "events": []
}
'''

[transforms.telemetry_logs]
type = "remap"
inputs = ["parse_system_logs", "parse_docker_logs"]
source = '''
event_timestamp = format_timestamp!(now(), format: "%+")
message = string!(.message)
level = string!(.level)
service = string(.service) ?? "unknown"
component = string(.component) ?? "agent"
agent_id = get_env_var!("SENTINEL_AGENT_ID")
host = get_env_var!("SENTINEL_HOSTNAME")
agent_version = get_env_var!("SENTINEL_AGENT_VERSION")

. = {
  "metadata": {
    "agent_id": agent_id,
    "hostname": host,
    "timestamp": event_timestamp,
    "agent_version": agent_version,
    "platform": "linux",
    "architecture": "amd64",
    "tags": {"source": "logs"}
  },
  "metrics": [],
  "logs": [{
    "message": message,
    "level": level,
    "timestamp": event_timestamp,
    "service": service,
    "component": component,
    "metadata": {"agent_id": agent_id},
    "parsed_fields": {}
  }],
  "events": []
}
'''

# -------------------------------
# HTTP sink with durable disk buffer
# -------------------------------

[sinks.sentinel_api]
type = "http"
inputs = ["telemetry_metrics", "telemetry_logs"]
uri = "${SENTINEL_API_ENDPOINT}/api/v1/telemetry"
method = "post"
encoding.codec = "json"
framing.method = "newline_delimited"
compression = "none"

[sinks.sentinel_api.batch]
max_events = 1
timeout_secs = 1

[sinks.sentinel_api.request.headers]
Authorization = "Bearer ${SENTINEL_API_KEY}"
Content-Type = "application/json"
User-Agent = "SentinelMonitorIA/${SENTINEL_AGENT_VERSION}"
X-Sentinel-Host = "${SENTINEL_HOSTNAME}"
X-Sentinel-Agent-ID = "${SENTINEL_AGENT_ID}"

[sinks.sentinel_api.request]
timeout_secs = 30
retry_attempts = 5
retry_initial_backoff_secs = 1
retry_max_duration_secs = 60

[sinks.sentinel_api.buffer]
type = "disk"
max_size = 1073741824
when_full = "block"

# Optional local console output for troubleshooting.
[sinks.local_log]
type = "console"
inputs = ["telemetry_logs"]
encoding.codec = "json"
target = "stdout"

# Optional Prometheus exporter for raw host metrics.
[sinks.local_metrics]
type = "prometheus_exporter"
inputs = ["enrich_system_metrics"]
address = "127.0.0.1:9598"
namespace = "sentinel_agent"
buckets = [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0]
