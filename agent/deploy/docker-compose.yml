version: '3.8'

services:
  sentinel-agent:
    build:
      context: ../..
      dockerfile: agent/Dockerfile
    container_name: sentinel-agent
    restart: unless-stopped
    environment:
      - SENTINEL_API_KEY=${SENTINEL_API_KEY:-test-key}
      - SENTINEL_API_ENDPOINT=${SENTINEL_API_ENDPOINT:-http://localhost:8000}
      - SENTINEL_AGENT_VERSION=1.0.0-dev
      - VECTOR_LOG_LEVEL=${VECTOR_LOG_LEVEL:-debug}
    volumes:
      # Montar socket de Docker para métricas de contenedores
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Montar logs del sistema
      - /var/log:/var/log:ro
      # Montar journald para logs del sistema
      - /run/journal:/run/journal:ro
      # Volumen para datos persistentes
      - sentinel-data:/var/lib/sentinelmonitoria
      # Configuración personalizada (opcional)
      - ./custom-config.toml:/etc/sentinelmonitoria/custom.toml:ro
    ports:
      # Exponer métricas Prometheus
      - "9598:9598"
    healthcheck:
      test: ["CMD", "/opt/sentinelmonitoria/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - sentinel-network
    cap_add:
      # Permisos necesarios para métricas del sistema
      - SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Servicio mock de API para desarrollo (opcional)
  mock-api:
    image: python:3.12-alpine
    container_name: sentinel-mock-api
    restart: unless-stopped
    command: >
      sh -c "pip install fastapi uvicorn && 
             echo 'from fastapi import FastAPI, Request; app = FastAPI()
             @app.post(\"/api/v1/telemetry\")
             async def telemetry(request: Request): 
                 data = await request.json(); 
                 print(f\"Received {len(data)}\" if isinstance(data, list) else \"Received telemetry\"); 
                 return {\"status\": \"ok\"}' > /app/main.py && 
             uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    networks:
      - sentinel-network

  # Prometheus para métricas (opcional)
  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - sentinel-network

  # Grafana para visualización (opcional)
  grafana:
    image: grafana/grafana:latest
    container_name: sentinel-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana-datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    networks:
      - sentinel-network

volumes:
  sentinel-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  sentinel-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: sentinel-net