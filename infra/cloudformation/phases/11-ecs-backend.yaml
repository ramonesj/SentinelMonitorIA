AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  SentinelMonitorIA phase 11: ARM64 Fargate backend task definition and ECS
  service connected to the phase 09 ALB target group.

Parameters:
  ProjectName:
    Type: String
    Default: SentinelMonitorIA
  EnvironmentName:
    Type: String
    Default: staging
    AllowedValues: [staging, production]
  DeploymentDay:
    Type: String
    Default: '2026-07-23'
    AllowedPattern: '^\d{4}-\d{2}-\d{2}$'
  BackendImageTag:
    Type: String
    Default: v0.1.0
    Description: Immutable ARM64 tag already pushed to the backend ECR repository.
  TaskCpu:
    Type: String
    Default: '256'
    AllowedValues: ['256', '512', '1024']
  TaskMemory:
    Type: String
    Default: '512'
    AllowedValues: ['512', '1024', '2048']
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 10
  ApiWorkers:
    Type: String
    Default: '2'
  LogLevel:
    Type: String
    Default: info
    AllowedValues: [debug, info, warning, error, critical]
  CorsOrigins:
    Type: String
    Default: http://localhost:3000
    Description: Comma-separated frontend origins for API CORS.
  RedisTls:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Enable TLS for the ElastiCache Redis connection.

Resources:
  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub sentinel-monitoria-${EnvironmentName}-backend
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: ARM64
      ExecutionRoleArn:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${EnvironmentName}-EcsTaskExecutionRoleArn'
      TaskRoleArn:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${EnvironmentName}-BackendTaskRoleArn'
      ContainerDefinitions:
        - Name: backend
          Image:
            Fn::Sub:
              - '${RepositoryUri}:${ImageTag}'
              - RepositoryUri:
                  Fn::ImportValue:
                    Fn::Sub: '${ProjectName}-${EnvironmentName}-BackendRepositoryUri'
                ImageTag: !Ref BackendImageTag
          Essential: true
          PortMappings:
            - Name: http
              ContainerPort: 8000
              HostPort: 8000
              Protocol: tcp
          Environment:
            - Name: ENVIRONMENT
              Value: !Ref EnvironmentName
            - Name: DEBUG
              Value: 'false'
            - Name: LOG_LEVEL
              Value: !Ref LogLevel
            - Name: API_HOST
              Value: 0.0.0.0
            - Name: API_PORT
              Value: '8000'
            - Name: API_WORKERS
              Value: !Ref ApiWorkers
            - Name: API_RELOAD
              Value: 'false'
            - Name: API_CORS_ORIGINS
              Value: !Ref CorsOrigins
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: POSTGRES_HOST
              Value:
                Fn::ImportValue:
                  Fn::Sub: '${ProjectName}-${EnvironmentName}-DatabaseEndpoint'
            - Name: POSTGRES_PORT
              Value: '5432'
            - Name: POSTGRES_DB
              Value:
                Fn::ImportValue:
                  Fn::Sub: '${ProjectName}-${EnvironmentName}-DatabaseName'
            - Name: REDIS_HOST
              Value:
                Fn::ImportValue:
                  Fn::Sub: '${ProjectName}-${EnvironmentName}-RedisEndpoint'
            - Name: REDIS_PORT
              Value: '6379'
            - Name: REDIS_DB
              Value: '0'
            - Name: REDIS_TLS
              Value: !Ref RedisTls
            - Name: REDIS_STREAM_PREFIX
              Value: sentinel:stream
            - Name: REDIS_STREAM_MAX_LENGTH
              Value: '10000'
            - Name: REDIS_STREAM_CONSUMER_GROUP
              Value: sentinel-telemetry-workers
            - Name: TELEMETRY_STALE_BATCH_SECONDS
              Value: '3600'
            - Name: REDIS_DEAD_LETTER_REPLAY_KEY
              Value: sentinel:stream:dead_letter:replayed
            - Name: TELEMETRY_BATCH_SIZE
              Value: '1000'
            - Name: TELEMETRY_BUFFER_SIZE
              Value: '10000'
            - Name: TELEMETRY_FLUSH_INTERVAL
              Value: '5'
            - Name: RATE_LIMIT_REQUESTS
              Value: '100'
            - Name: RATE_LIMIT_PERIOD
              Value: '60'
            - Name: RATE_LIMIT_ORGANIZATION_REQUESTS
              Value: '1000'
            - Name: QUEUE_PROVIDER
              Value: redis
            - Name: HEALTH_CHECK_TIMEOUT
              Value: '5'
            - Name: HEALTH_CHECK_RETRIES
              Value: '3'
          Secrets:
            - Name: SECRET_KEY
              ValueFrom:
                Fn::Sub:
                  - '${SecretArn}:secret_key::'
                  - SecretArn:
                      Fn::ImportValue:
                        Fn::Sub: '${ProjectName}-${EnvironmentName}-ApplicationSecretArn'
            - Name: JWT_SECRET_KEY
              ValueFrom:
                Fn::Sub:
                  - '${SecretArn}:jwt_secret_key::'
                  - SecretArn:
                      Fn::ImportValue:
                        Fn::Sub: '${ProjectName}-${EnvironmentName}-JwtSecretArn'
            - Name: POSTGRES_USER
              ValueFrom:
                Fn::Sub:
                  - '${SecretArn}:username::'
                  - SecretArn:
                      Fn::ImportValue:
                        Fn::Sub: '${ProjectName}-${EnvironmentName}-DatabaseSecretArn'
            - Name: POSTGRES_PASSWORD
              ValueFrom:
                Fn::Sub:
                  - '${SecretArn}:password::'
                  - SecretArn:
                      Fn::ImportValue:
                        Fn::Sub: '${ProjectName}-${EnvironmentName}-DatabaseSecretArn'
            - Name: REDIS_PASSWORD
              ValueFrom:
                Fn::Sub:
                  - '${SecretArn}:auth_token::'
                  - SecretArn:
                      Fn::ImportValue:
                        Fn::Sub: '${ProjectName}-${EnvironmentName}-RedisSecretArn'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue:
                  Fn::Sub: '${ProjectName}-${EnvironmentName}-BackendLogGroupName'
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -f http://localhost:8000/health || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-backend-task
        - Key: Component
          Value: backend
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DeploymentDay
          Value: !Ref DeploymentDay
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CostCenter
          Value: !Sub ${ProjectName}-${EnvironmentName}

  BackendService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub sentinel-monitoria-${EnvironmentName}-backend
      Cluster:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${EnvironmentName}-EcsClusterArn'
      TaskDefinition: !Ref BackendTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MaximumPercent: 200
        MinimumHealthyPercent: 50
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${EnvironmentName}-BackendSecurityGroupId'
          Subnets:
            - Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${EnvironmentName}-PrivateSubnet1Id'
            - Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${EnvironmentName}-PrivateSubnet2Id'
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 8000
          TargetGroupArn:
            Fn::ImportValue:
              Fn::Sub: '${ProjectName}-${EnvironmentName}-BackendTargetGroupArn'
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-backend-service
        - Key: Component
          Value: backend
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DeploymentDay
          Value: !Ref DeploymentDay
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CostCenter
          Value: !Sub ${ProjectName}-${EnvironmentName}

Outputs:
  BackendTaskDefinitionArn:
    Description: Backend ECS task definition ARN.
    Value: !Ref BackendTaskDefinition
  BackendServiceArn:
    Description: Backend ECS service ARN.
    Value: !Ref BackendService
