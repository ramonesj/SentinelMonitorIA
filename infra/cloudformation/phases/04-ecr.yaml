AWSTemplateFormatVersion: '2010-09-09'
Description: 'SentinelMonitorIA phase 04: immutable ECR repositories for backend and worker.'

Parameters:
  ProjectName:
    Type: String
    Default: SentinelMonitorIA
  EnvironmentName:
    Type: String
    Default: staging
    AllowedValues: [staging, production]
  DeploymentDay:
    Type: String
    Default: '2026-07-23'
    AllowedPattern: '^\d{4}-\d{2}-\d{2}$'

Resources:
  BackendRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub sentinel-monitoria/${EnvironmentName}/backend
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the ten newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-backend
        - Key: Component
          Value: backend
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DeploymentDay
          Value: !Ref DeploymentDay
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CostCenter
          Value: !Sub ${ProjectName}-${EnvironmentName}

  WorkerRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub sentinel-monitoria/${EnvironmentName}/worker
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the ten newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-worker
        - Key: Component
          Value: worker
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DeploymentDay
          Value: !Ref DeploymentDay
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CostCenter
          Value: !Sub ${ProjectName}-${EnvironmentName}

Outputs:
  BackendRepositoryUri:
    Description: Backend ECR repository URI.
    Value: !GetAtt BackendRepository.RepositoryUri
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-BackendRepositoryUri
  BackendRepositoryArn:
    Description: Backend ECR repository ARN.
    Value: !GetAtt BackendRepository.Arn
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-BackendRepositoryArn
  WorkerRepositoryUri:
    Description: Worker ECR repository URI.
    Value: !GetAtt WorkerRepository.RepositoryUri
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-WorkerRepositoryUri
  WorkerRepositoryArn:
    Description: Worker ECR repository ARN.
    Value: !GetAtt WorkerRepository.Arn
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-WorkerRepositoryArn
