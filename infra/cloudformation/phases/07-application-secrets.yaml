AWSTemplateFormatVersion: '2010-09-09'
Description: 'SentinelMonitorIA phase 07: generated application and JWT secrets.'

Resources:
  ApplicationSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${ProjectName}-${EnvironmentName}-application
      Description: Generated SECRET_KEY for SentinelMonitorIA.
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: secret_key
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-application-secret
        - Key: Component
          Value: application
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DeploymentDay
          Value: !Ref DeploymentDay
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CostCenter
          Value: !Sub ${ProjectName}-${EnvironmentName}

  JwtSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${ProjectName}-${EnvironmentName}-jwt
      Description: Generated JWT_SECRET_KEY for SentinelMonitorIA.
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: jwt_secret_key
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-jwt-secret
        - Key: Component
          Value: application
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DeploymentDay
          Value: !Ref DeploymentDay
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CostCenter
          Value: !Sub ${ProjectName}-${EnvironmentName}

Parameters:
  ProjectName:
    Type: String
    Default: SentinelMonitorIA
  EnvironmentName:
    Type: String
    Default: staging
    AllowedValues: [staging, production]
  DeploymentDay:
    Type: String
    Default: '2026-07-23'
    AllowedPattern: '^\d{4}-\d{2}-\d{2}$'

Outputs:
  ApplicationSecretArn:
    Description: Secret ARN containing secret_key.
    Value: !Ref ApplicationSecret
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-ApplicationSecretArn
  JwtSecretArn:
    Description: Secret ARN containing jwt_secret_key.
    Value: !Ref JwtSecret
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-JwtSecretArn
