AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  SentinelMonitorIA phase 00: VPC, public/private subnets, Internet Gateway
  and route tables for us-east-1. Deploy before all dependent phases.

Parameters:
  ProjectName:
    Type: String
    Default: SentinelMonitorIA
    AllowedPattern: '^[A-Za-z][A-Za-z0-9-]{1,31}$'
  EnvironmentName:
    Type: String
    Default: staging
    AllowedValues: [staging, production]
  DeploymentDay:
    Type: String
    Default: '2026-07-23'
    AllowedPattern: '^\d{4}-\d{2}-\d{2}$'
  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
  AvailabilityZone1:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1a
  AvailabilityZone2:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1b
  PublicSubnet1Cidr:
    Type: String
    Default: 10.42.1.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.42.2.0/24
  PrivateSubnet1Cidr:
    Type: String
    Default: 10.42.11.0/24
  PrivateSubnet2Cidr:
    Type: String
    Default: 10.42.12.0/24

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-vpc
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DeploymentDay
          Value: !Ref DeploymentDay
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CostCenter
          Value: !Sub ${ProjectName}-${EnvironmentName}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-igw
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DeploymentDay
          Value: !Ref DeploymentDay
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CostCenter
          Value: !Sub ${ProjectName}-${EnvironmentName}

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Ref AvailabilityZone1
      CidrBlock: !Ref PublicSubnet1Cidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-public-1
        - Key: Tier
          Value: public
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DeploymentDay
          Value: !Ref DeploymentDay
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CostCenter
          Value: !Sub ${ProjectName}-${EnvironmentName}

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Ref AvailabilityZone2
      CidrBlock: !Ref PublicSubnet2Cidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-public-2
        - Key: Tier
          Value: public
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DeploymentDay
          Value: !Ref DeploymentDay
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CostCenter
          Value: !Sub ${ProjectName}-${EnvironmentName}

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Ref AvailabilityZone1
      CidrBlock: !Ref PrivateSubnet1Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-private-1
        - Key: Tier
          Value: private
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DeploymentDay
          Value: !Ref DeploymentDay
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CostCenter
          Value: !Sub ${ProjectName}-${EnvironmentName}

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Ref AvailabilityZone2
      CidrBlock: !Ref PrivateSubnet2Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-private-2
        - Key: Tier
          Value: private
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DeploymentDay
          Value: !Ref DeploymentDay
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CostCenter
          Value: !Sub ${ProjectName}-${EnvironmentName}

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-public-routes
        - Key: Tier
          Value: public
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DeploymentDay
          Value: !Ref DeploymentDay
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CostCenter
          Value: !Sub ${ProjectName}-${EnvironmentName}

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-private-routes-1
        - Key: Tier
          Value: private
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DeploymentDay
          Value: !Ref DeploymentDay
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CostCenter
          Value: !Sub ${ProjectName}-${EnvironmentName}

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-private-routes-2
        - Key: Tier
          Value: private
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DeploymentDay
          Value: !Ref DeploymentDay
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CostCenter
          Value: !Sub ${ProjectName}-${EnvironmentName}

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      SubnetId: !Ref PrivateSubnet1

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      SubnetId: !Ref PrivateSubnet2

Outputs:
  VpcId:
    Description: VPC ID.
    Value: !Ref VPC
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-VpcId
  VpcCidr:
    Description: VPC CIDR.
    Value: !Ref VpcCidr
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-VpcCidr
  PublicSubnet1Id:
    Description: Public subnet 1 ID.
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-PublicSubnet1Id
  PublicSubnet2Id:
    Description: Public subnet 2 ID.
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-PublicSubnet2Id
  PublicSubnetIds:
    Description: Public subnet IDs in AZ order.
    Value: !Join [',', [!Ref PublicSubnet1, !Ref PublicSubnet2]]
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-PublicSubnetIds
  PublicSubnet1Cidr:
    Description: Public subnet 1 CIDR.
    Value: !Ref PublicSubnet1Cidr
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-PublicSubnet1Cidr
  PublicSubnet2Cidr:
    Description: Public subnet 2 CIDR.
    Value: !Ref PublicSubnet2Cidr
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-PublicSubnet2Cidr
  PrivateSubnet1Id:
    Description: Private subnet 1 ID.
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-PrivateSubnet1Id
  PrivateSubnet2Id:
    Description: Private subnet 2 ID.
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-PrivateSubnet2Id
  PrivateSubnetIds:
    Description: Private subnet IDs in AZ order.
    Value: !Join [',', [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-PrivateSubnetIds
  PrivateSubnet1Cidr:
    Description: Private subnet 1 CIDR.
    Value: !Ref PrivateSubnet1Cidr
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-PrivateSubnet1Cidr
  PrivateSubnet2Cidr:
    Description: Private subnet 2 CIDR.
    Value: !Ref PrivateSubnet2Cidr
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-PrivateSubnet2Cidr
  PublicRouteTableId:
    Description: Public route table ID.
    Value: !Ref PublicRouteTable
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-PublicRouteTableId
  PrivateRouteTable1Id:
    Description: Private route table 1 ID.
    Value: !Ref PrivateRouteTable1
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-PrivateRouteTable1Id
  PrivateRouteTable2Id:
    Description: Private route table 2 ID.
    Value: !Ref PrivateRouteTable2
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-PrivateRouteTable2Id
