AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  SentinelMonitorIA phase 14: CloudFront distribution with Origin Access
  Control for the private frontend and an ALB origin for API, health and
  WebSocket traffic. The default CloudFront hostname works without a custom
  domain or Route 53 hosted zone.

Parameters:
  ProjectName:
    Type: String
    Default: SentinelMonitorIA
  EnvironmentName:
    Type: String
    Default: staging
    AllowedValues: [staging, production]
  DeploymentDay:
    Type: String
    Default: '2026-07-23'
    AllowedPattern: '^\d{4}-\d{2}-\d{2}$'
  UseCustomDomain:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  FrontendDomainName:
    Type: String
    Default: ''
  FrontendCertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN in us-east-1; required when UseCustomDomain is true.
  ApiOriginProtocolPolicy:
    Type: String
    Default: http-only
    AllowedValues: [http-only, https-only, match-viewer]
    Description: >-
      CloudFront-to-ALB protocol. Use http-only for the no-domain demo;
      use https-only after enabling the ALB HTTPS listener with a valid certificate.
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]

Conditions:
  HasCustomDomain: !Equals [!Ref UseCustomDomain, 'true']

Resources:
  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub sentinel-monitoria-${EnvironmentName}-api-no-cache
        Comment: Do not cache authenticated API, health or WebSocket responses.
        DefaultTTL: 0
        MinTTL: 0
        MaxTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: false
          EnableAcceptEncodingGzip: false
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub sentinel-monitoria-${EnvironmentName}-api-origin
        Comment: Forward authentication, CORS and WebSocket request headers to the ALB.
        CookiesConfig:
          CookieBehavior: none
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Accept
            - Authorization
            - Content-Type
            - Origin
            - Access-Control-Request-Headers
            - Access-Control-Request-Method
            - Upgrade
            - Sec-WebSocket-Key
            - Sec-WebSocket-Version
            - Sec-WebSocket-Protocol
            - Sec-WebSocket-Extensions
        QueryStringsConfig:
          QueryStringBehavior: all

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub sentinel-monitoria-${EnvironmentName}-frontend-oac
        Description: CloudFront access to the private frontend S3 bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub sentinel-monitoria-${EnvironmentName}-spa-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite frontend SPA routes without intercepting API paths.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var lastSegment = uri.substring(uri.lastIndexOf('/') + 1);
          var hasFileExtension = lastSegment.indexOf('.') !== -1;
          var isApiPath = uri.indexOf('/api/') === 0 || uri === '/api';
          var isHealthPath = uri.indexOf('/health') === 0;
          var isMetricsPath = uri.indexOf('/metrics') === 0;

          if (!hasFileExtension && !isApiPath && !isHealthPath && !isMetricsPath) {
            request.uri = '/index.html';
          }

          return request;
        }

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub SentinelMonitorIA ${EnvironmentName} frontend
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: !Ref PriceClass
        Aliases:
          Fn::If:
            - HasCustomDomain
            - - !Ref FrontendDomainName
            - !Ref AWS::NoValue
        Origins:
          - Id: FrontendS3Origin
            DomainName:
              Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${EnvironmentName}-FrontendBucketRegionalDomainName'
            OriginAccessControlId: !Ref FrontendOriginAccessControl
            S3OriginConfig: {}
          - Id: ApiAlbOrigin
            DomainName:
              Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${EnvironmentName}-LoadBalancerDnsName'
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: !Ref ApiOriginProtocolPolicy
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiAlbOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            Compress: false
          - PathPattern: /health*
            TargetOriginId: ApiAlbOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            Compress: false
          - PathPattern: /metrics*
            TargetOriginId: ApiAlbOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            Compress: false
        ViewerCertificate:
          Fn::If:
            - HasCustomDomain
            - AcmCertificateArn: !Ref FrontendCertificateArn
              SslSupportMethod: sni-only
              MinimumProtocolVersion: TLSv1.2_2021
            - CloudFrontDefaultCertificate: true
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-cloudfront
        - Key: Component
          Value: cloudfront
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DeploymentDay
          Value: !Ref DeploymentDay
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CostCenter
          Value: !Sub ${ProjectName}-${EnvironmentName}

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${EnvironmentName}-FrontendBucketName'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServiceReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource:
              Fn::Sub:
                - '${BucketArn}/*'
                - BucketArn:
                    Fn::ImportValue:
                      Fn::Sub: '${ProjectName}-${EnvironmentName}-FrontendBucketArn'
            Condition:
              StringEquals:
                AWS:SourceArn:
                  Fn::Sub:
                    - arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DistributionId}
                    - DistributionId: !Ref FrontendDistribution

Outputs:
  CloudFrontDistributionId:
    Description: CloudFront distribution ID.
    Value: !Ref FrontendDistribution
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-CloudFrontDistributionId
  CloudFrontDistributionArn:
    Description: CloudFront distribution ARN.
    Value: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-CloudFrontDistributionArn
  CloudFrontDomainName:
    Description: CloudFront DNS name.
    Value: !GetAtt FrontendDistribution.DomainName
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-CloudFrontDomainName
  CloudFrontHostedZoneId:
    Description: CloudFront alias hosted zone ID.
    Value: Z2FDTNDATAQYW2
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-CloudFrontHostedZoneId
