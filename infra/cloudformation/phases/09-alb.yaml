AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  SentinelMonitorIA phase 09: public Application Load Balancer, backend target
  group and HTTP listener. HTTPS is added by phase 17.

Parameters:
  ProjectName:
    Type: String
    Default: SentinelMonitorIA
  EnvironmentName:
    Type: String
    Default: staging
    AllowedValues: [staging, production]
  DeploymentDay:
    Type: String
    Default: '2026-07-23'
    AllowedPattern: '^\d{4}-\d{2}-\d{2}$'
  IdleTimeoutSeconds:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 4000

Resources:
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub sm-${EnvironmentName}-alb
      Scheme: internet-facing
      IpAddressType: ipv4
      SecurityGroups:
        - Fn::ImportValue:
            Fn::Sub: '${ProjectName}-${EnvironmentName}-AlbSecurityGroupId'
      Subnets:
        - Fn::ImportValue:
            Fn::Sub: '${ProjectName}-${EnvironmentName}-PublicSubnet1Id'
        - Fn::ImportValue:
            Fn::Sub: '${ProjectName}-${EnvironmentName}-PublicSubnet2Id'
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: !Ref IdleTimeoutSeconds
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-alb
        - Key: Component
          Value: alb
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DeploymentDay
          Value: !Ref DeploymentDay
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CostCenter
          Value: !Sub ${ProjectName}-${EnvironmentName}

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub sm-${EnvironmentName}-backend
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      VpcId:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${EnvironmentName}-VpcId'
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckPort: '8000'
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200-399'
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-backend-targets
        - Key: Component
          Value: backend
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DeploymentDay
          Value: !Ref DeploymentDay
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CostCenter
          Value: !Sub ${ProjectName}-${EnvironmentName}

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          ForwardConfig:
            TargetGroups:
              - TargetGroupArn: !Ref BackendTargetGroup
                Weight: 1

Outputs:
  LoadBalancerArn:
    Description: Application Load Balancer ARN.
    Value: !Ref ApplicationLoadBalancer
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-LoadBalancerArn
  LoadBalancerDnsName:
    Description: Application Load Balancer DNS name.
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-LoadBalancerDnsName
  LoadBalancerHostedZoneId:
    Description: Canonical hosted zone ID for ALB aliases.
    Value: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-LoadBalancerHostedZoneId
  BackendTargetGroupArn:
    Description: Backend target group ARN.
    Value: !Ref BackendTargetGroup
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-BackendTargetGroupArn
  HttpListenerArn:
    Description: HTTP listener ARN.
    Value: !Ref HttpListener
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-HttpListenerArn
