AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  SentinelMonitorIA phase 21: ARM64 ECS worker for deterministic analysis,
  optional Ollama/Bedrock explanations and alert creation.

Parameters:
  ProjectName:
    Type: String
    Default: SentinelMonitorIA
  EnvironmentName:
    Type: String
    Default: staging
    AllowedValues: [staging, production]
  DeploymentDay:
    Type: String
    Default: '2026-07-23'
    AllowedPattern: '^\d{4}-\d{2}-\d{2}$'
  WorkerImageTag:
    Type: String
    Default: v0.1.0
    Description: Immutable ARM64 tag already pushed to the worker ECR repository.
  TaskCpu:
    Type: String
    Default: '512'
    AllowedValues: ['256', '512', '1024']
  TaskMemory:
    Type: String
    Default: '1024'
    AllowedValues: ['512', '1024', '2048']
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 10
  LogLevel:
    Type: String
    Default: info
    AllowedValues: [debug, info, warning, error, critical]
  AiProvider:
    Type: String
    Default: rules
    AllowedValues: [rules, bedrock]
    Description: Use rules for no-model staging or bedrock after model access is approved.
  BedrockModelId:
    Type: String
    Default: ''
    Description: Foundation model ID permitted by phase 19 IAM policy.
  BedrockKnowledgeBaseId:
    Type: String
    Default: ''
    Description: Optional existing Knowledge Base ID for retrieval-augmented context.
  NotificationChannels:
    Type: String
    Default: log
    Description: Comma-separated channels such as log,email,slack,discord,teams,webhook.

Resources:
  AiWorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub sentinel-monitoria-${EnvironmentName}-ai-worker
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: ARM64
      ExecutionRoleArn:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${EnvironmentName}-EcsTaskExecutionRoleArn'
      TaskRoleArn:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${EnvironmentName}-AiTaskRoleArn'
      ContainerDefinitions:
        - Name: ai-worker
          Image:
            Fn::Sub:
              - '${RepositoryUri}:${ImageTag}'
              - RepositoryUri:
                  Fn::ImportValue:
                    Fn::Sub: '${ProjectName}-${EnvironmentName}-WorkerRepositoryUri'
                ImageTag: !Ref WorkerImageTag
          Essential: true
          Command: [python, -m, src.workers.ai_analysis_worker]
          Environment:
            - Name: ENVIRONMENT
              Value: !Ref EnvironmentName
            - Name: DEBUG
              Value: 'false'
            - Name: LOG_LEVEL
              Value: !Ref LogLevel
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: POSTGRES_HOST
              Value:
                Fn::ImportValue:
                  Fn::Sub: '${ProjectName}-${EnvironmentName}-DatabaseEndpoint'
            - Name: POSTGRES_PORT
              Value: '5432'
            - Name: POSTGRES_DB
              Value:
                Fn::ImportValue:
                  Fn::Sub: '${ProjectName}-${EnvironmentName}-DatabaseName'
            - Name: REDIS_HOST
              Value:
                Fn::ImportValue:
                  Fn::Sub: '${ProjectName}-${EnvironmentName}-RedisEndpoint'
            - Name: REDIS_PORT
              Value: '6379'
            - Name: REDIS_DB
              Value: '0'
            - Name: REDIS_STREAM_PREFIX
              Value: sentinel:stream
            - Name: REDIS_STREAM_MAX_LENGTH
              Value: '10000'
            - Name: REDIS_DEAD_LETTER_REPLAY_KEY
              Value: sentinel:stream:dead_letter:replayed
            - Name: AI_ANALYSIS_CONSUMER_GROUP
              Value: sentinel-ai-analysis-workers
            - Name: NOTIFICATION_CONSUMER_GROUP
              Value: sentinel-notification-workers
            - Name: QUEUE_PROVIDER
              Value: redis
            - Name: AI_PROVIDER
              Value: !Ref AiProvider
            - Name: AI_MODEL_ID
              Value: !Ref BedrockModelId
            - Name: AI_KNOWLEDGE_BASE_ID
              Value: !Ref BedrockKnowledgeBaseId
            - Name: AI_LOG_ARCHIVE_BUCKET
              Value:
                Fn::ImportValue:
                  Fn::Sub: '${ProjectName}-${EnvironmentName}-AiLogArchiveBucketName'
            - Name: AI_ENABLE_ACTIONS
              Value: 'false'
            - Name: NOTIFICATION_CHANNELS
              Value: !Ref NotificationChannels
          Secrets:
            - Name: SECRET_KEY
              ValueFrom:
                Fn::Sub:
                  - '${SecretArn}:secret_key::'
                  - SecretArn:
                      Fn::ImportValue:
                        Fn::Sub: '${ProjectName}-${EnvironmentName}-ApplicationSecretArn'
            - Name: JWT_SECRET_KEY
              ValueFrom:
                Fn::Sub:
                  - '${SecretArn}:jwt_secret_key::'
                  - SecretArn:
                      Fn::ImportValue:
                        Fn::Sub: '${ProjectName}-${EnvironmentName}-JwtSecretArn'
            - Name: POSTGRES_USER
              ValueFrom:
                Fn::Sub:
                  - '${SecretArn}:username::'
                  - SecretArn:
                      Fn::ImportValue:
                        Fn::Sub: '${ProjectName}-${EnvironmentName}-DatabaseSecretArn'
            - Name: POSTGRES_PASSWORD
              ValueFrom:
                Fn::Sub:
                  - '${SecretArn}:password::'
                  - SecretArn:
                      Fn::ImportValue:
                        Fn::Sub: '${ProjectName}-${EnvironmentName}-DatabaseSecretArn'
            - Name: REDIS_PASSWORD
              ValueFrom:
                Fn::Sub:
                  - '${SecretArn}:auth_token::'
                  - SecretArn:
                      Fn::ImportValue:
                        Fn::Sub: '${ProjectName}-${EnvironmentName}-RedisSecretArn'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue:
                  Fn::Sub: '${ProjectName}-${EnvironmentName}-AiWorkerLogGroupName'
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ai-worker
          HealthCheck:
            Command:
              - CMD-SHELL
              - python -c "import os; raise SystemExit(0 if os.path.exists('/proc/1/cmdline') else 1)"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-ai-worker-task
        - Key: Component
          Value: ai-worker
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DeploymentDay
          Value: !Ref DeploymentDay
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CostCenter
          Value: !Sub ${ProjectName}-${EnvironmentName}

  AiWorkerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub sentinel-monitoria-${EnvironmentName}-ai-worker
      Cluster:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${EnvironmentName}-EcsClusterArn'
      TaskDefinition: !Ref AiWorkerTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MaximumPercent: 200
        MinimumHealthyPercent: 50
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${EnvironmentName}-BackendSecurityGroupId'
          Subnets:
            - Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${EnvironmentName}-PrivateSubnet1Id'
            - Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${EnvironmentName}-PrivateSubnet2Id'
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-ai-worker-service
        - Key: Component
          Value: ai-worker
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DeploymentDay
          Value: !Ref DeploymentDay
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CostCenter
          Value: !Sub ${ProjectName}-${EnvironmentName}

Outputs:
  AiWorkerTaskDefinitionArn:
    Description: AI analysis worker task definition ARN.
    Value: !Ref AiWorkerTaskDefinition
  AiWorkerServiceArn:
    Description: AI analysis worker service ARN.
    Value: !Ref AiWorkerService
