AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  SentinelMonitorIA offline foundation: network, private data services and ECR
  repositories. Review costs, IAM, secrets and regional support before use.

Parameters:
  EnvironmentName:
    Type: String
    Default: staging
    AllowedValues:
      - staging
      - production
    Description: Environment suffix used in names and tags.
  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
    Description: CIDR block for the VPC.
  AvailabilityZone1:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: First availability zone for the two-AZ foundation.
  AvailabilityZone2:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Second availability zone for the two-AZ foundation.
  PublicSubnet1Cidr:
    Type: String
    Default: 10.42.1.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.42.2.0/24
  PrivateSubnet1Cidr:
    Type: String
    Default: 10.42.11.0/24
  PrivateSubnet2Cidr:
    Type: String
    Default: 10.42.12.0/24
  DBName:
    Type: String
    Default: sentinelmonitoria
    AllowedPattern: '^[a-z][a-z0-9_]{0,62}$'
  DBUsername:
    Type: String
    Default: sentinel
    MinLength: 1
    MaxLength: 63
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]*$'
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    MaxLength: 128
    Description: Temporary bootstrap password; use Secrets Manager before production.
  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: RDS instance class; confirm availability and pricing per region.
  DBAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 16384
  DBBackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 0
    MaxValue: 35
  RedisNodeType:
    Type: String
    Default: cache.t4g.micro
    Description: ElastiCache node type; confirm availability and pricing per region.
  RedisAuthToken:
    Type: String
    NoEcho: true
    MinLength: 16
    MaxLength: 128
    Description: Temporary Redis auth token; use Secrets Manager before production.
  RedisSnapshotRetentionDays:
    Type: Number
    Default: 7
    MinValue: 0
    MaxValue: 35

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-vpc
        - Key: Environment
          Value: !Ref EnvironmentName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Ref AvailabilityZone1
      CidrBlock: !Ref PublicSubnet1Cidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-public-1
        - Key: Tier
          Value: public

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Ref AvailabilityZone2
      CidrBlock: !Ref PublicSubnet2Cidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-public-2
        - Key: Tier
          Value: public

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Ref AvailabilityZone1
      CidrBlock: !Ref PrivateSubnet1Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-private-1
        - Key: Tier
          Value: private

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Ref AvailabilityZone2
      CidrBlock: !Ref PrivateSubnet2Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-private-2
        - Key: Tier
          Value: private

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-public-routes

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-private-routes-1

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-private-routes-2

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      SubnetId: !Ref PrivateSubnet1

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      SubnetId: !Ref PrivateSubnet2

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Future ECS tasks or backend services for SentinelMonitorIA.
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-backend-sg

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private PostgreSQL access from the backend security group only.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref BackendSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-database-sg

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private Redis access from the backend security group only.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref BackendSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-redis-sg

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for SentinelMonitorIA PostgreSQL.
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-db-subnet-group

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DBInstanceIdentifier: !Sub sentinel-monitoria-${EnvironmentName}-postgres
      Engine: postgres
      EngineVersion: '15.4'
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      Port: 5432
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: !Ref DBBackupRetentionDays
      CopyTagsToSnapshot: true
      DeleteAutomatedBackups: false
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      EnableCloudwatchLogsExports:
        - postgresql
      PreferredBackupWindow: 03:00-03:30
      PreferredMaintenanceWindow: sun:04:00-sun:04:30
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-postgres
        - Key: Environment
          Value: !Ref EnvironmentName

  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Private subnets for SentinelMonitorIA Redis.
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  Redis:
    Type: AWS::ElastiCache::ReplicationGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ReplicationGroupId: !Sub sm-${EnvironmentName}-redis
      ReplicationGroupDescription: Private Redis for SentinelMonitorIA rate limiting and queues.
      Engine: redis
      EngineVersion: '7.0'
      CacheNodeType: !Ref RedisNodeType
      NumCacheClusters: 1
      AutomaticFailoverEnabled: false
      MultiAzEnabled: false
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: true
      AuthToken: !Ref RedisAuthToken
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      SecurityGroupIds:
        - !Ref RedisSecurityGroup
      SnapshotRetentionLimit: !Ref RedisSnapshotRetentionDays
      SnapshotWindow: 02:00-03:00
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-redis
        - Key: Environment
          Value: !Ref EnvironmentName

  BackendRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub sentinel-monitoria/${EnvironmentName}/backend
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-backend
        - Key: Environment
          Value: !Ref EnvironmentName

  WorkerRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub sentinel-monitoria/${EnvironmentName}/worker
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      Tags:
        - Key: Name
          Value: !Sub sentinel-monitoria-${EnvironmentName}-worker
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  VpcId:
    Description: Foundation VPC ID.
    Value: !Ref VPC
    Export:
      Name: !Sub ${AWS::StackName}-VpcId
  PublicSubnetIds:
    Description: Public subnet IDs for a future ALB layer.
    Value: !Join [',', [!Ref PublicSubnet1, !Ref PublicSubnet2]]
  PrivateSubnetIds:
    Description: Private subnet IDs for ECS, RDS and ElastiCache layers.
    Value: !Join [',', [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
  BackendSecurityGroupId:
    Description: Security group to attach to future backend tasks.
    Value: !Ref BackendSecurityGroup
  DatabaseEndpoint:
    Description: Private PostgreSQL endpoint.
    Value: !GetAtt Database.Endpoint.Address
  DatabasePort:
    Description: PostgreSQL port.
    Value: !GetAtt Database.Endpoint.Port
  RedisEndpoint:
    Description: Private Redis primary endpoint.
    Value: !GetAtt Redis.PrimaryEndPoint.Address
  RedisPort:
    Description: Redis port.
    Value: !GetAtt Redis.PrimaryEndPoint.Port
  BackendRepositoryUri:
    Description: Backend ECR repository URI.
    Value: !GetAtt BackendRepository.RepositoryUri
  WorkerRepositoryUri:
    Description: Worker ECR repository URI.
    Value: !GetAtt WorkerRepository.RepositoryUri
