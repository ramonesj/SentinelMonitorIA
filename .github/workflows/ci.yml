name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate backend and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate Docker Compose configuration
        run: docker compose -f backend/docker-compose.yml config --quiet

      - name: Validate local-production Compose configuration
        env:
          ENVIRONMENT: local-production
          POSTGRES_DB: sentinelmonitoria_ci
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          SECRET_KEY: ci-secret-key-with-at-least-32-characters
          JWT_SECRET_KEY: ci-jwt-secret-with-at-least-32-characters
          API_CORS_ORIGINS: '["http://localhost:3000"]'
        run: docker compose -f backend/docker-compose.local-production.yml config --quiet

      - name: Validate optional frontend Compose configuration
        run: docker compose -f backend/docker-compose.yml -f backend/docker-compose.frontend.yml config --quiet

      - name: Start backend test stack
        run: docker compose -f backend/docker-compose.yml up -d --build postgres redis backend

      - name: Wait for backend health
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format='{{.State.Health.Status}}' sentinel-backend 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done

          docker compose -f backend/docker-compose.yml logs backend postgres redis
          echo "Backend did not become healthy within the expected time."
          exit 1

      - name: Compile backend sources
        run: docker compose -f backend/docker-compose.yml exec -T backend sh -c "rm -rf /tmp/sentinel-compile && cp -R src /tmp/sentinel-compile && python -m compileall -q /tmp/sentinel-compile"

      - name: Run backend test suite
        run: docker compose -f backend/docker-compose.yml exec -T backend pytest -q

      - name: Check whitespace errors
        run: git diff --check

      - name: Show backend logs on failure
        if: ${{ failure() }}
        run: docker compose -f backend/docker-compose.yml logs backend postgres redis

      - name: Stop test stack
        if: ${{ always() }}
        run: docker compose -f backend/docker-compose.yml down -v --remove-orphans
